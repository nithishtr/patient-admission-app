server.port=${PORT:8080}

# Local default: file-based H2 (data survives restarts, stored in ./data).
# In production set DB_URL / DB_USER / DB_PASSWORD env vars (e.g. PostgreSQL).
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/patientdb}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

spring.jackson.deserialization.accept-float-as-int=false
app.cors-origins=${CORS_ORIGINS:*}
